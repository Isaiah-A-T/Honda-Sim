# Honda Sim for phones. Its own workspace so it builds without touching native/ or viewer/.
#   shared/   the phone app itself: touch pedals, phone menus, the 3D view and the sim thread
#   android/  the Android entry point and APK settings (cargo apk build)
#   ios/      the iOS entry point, the OpenGL ES surface and the Xcode project
[workspace]
resolver = "2"
members = ["shared", "android", "ios"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 3
