[package]
name = "honda-sim-ios"
version = "0.9.0"
edition = "2021"
description = "Honda Sim for iOS"
license = "MIT"

[lib]
name = "honda_sim_ios"
crate-type = ["staticlib"]
path = "src/lib.rs"

[target.'cfg(target_os = "ios")'.dependencies]
honda-sim-mobile = { path = "../shared" }
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSArray", "NSPathUtilities"] }
