[package]
name = "honda-sim-android"
version = "0.11.1"
edition = "2021"
description = "Honda Sim for Android"
license = "MIT"

[lib]
name = "honda_sim"
crate-type = ["cdylib"]
path = "src/lib.rs"

[target.'cfg(target_os = "android")'.dependencies]
honda-sim-mobile = { path = "../shared/phone" }
winit = { version = "0.28", features = ["android-native-activity"] }
jni = "0.21"
log = "0.4"
android_logger = "0.13"

# APK settings for cargo-apk (cargo install cargo-apk; cargo apk build --release -p honda-sim-android).
[package.metadata.android]
package = "com.hondasim.app"
apk_name = "HondaSim"
build_targets = ["aarch64-linux-android"]
# Keep the app's files in the shared storage folder Android/data/com.hondasim.app/files where file managers
# and a USB cable can reach them.
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_feature]]
name = "android.hardware.touchscreen"
required = false

[[package.metadata.android.uses_feature]]
opengles_version = [3, 0]
required = true

[package.metadata.android.application]
label = "Honda Sim"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
orientation = "sensorLandscape"
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|keyboard|navigation|uiMode"
launch_mode = "singleTask"

[package.metadata.android.signing.release]
# CI signs with a key from the repository's secrets when one is set (see .github/workflows/android.yml),
# otherwise with the debug key cargo-apk makes, which is fine for installing from the APK directly.
path = "../target/honda-sim-release.keystore"
keystore_password = "android"
