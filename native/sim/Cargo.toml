[package]
name = "honda-sim-core"
version = "0.9.0"
edition = "2021"
description = "Honda Sim engine, drivetrain and internals model (K20Z3), native port of src/*.js"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
